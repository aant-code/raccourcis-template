services:
  api:
    build: 
      context: ./backend
      platforms: ["linux/amd64", "linux/arm64"]
    image: aantt/raccourcis-api
    volumes:
      - ./content:/app/content

  frontend:
    build: 
      context: ./frontend
      platforms: ["linux/amd64", "linux/arm64"]
    image: aantt/raccourcis-frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:5050
    depends_on:
      - api
