name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Connexion à Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u aantt --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'API
        run: |
          docker build -t aantt/raccourcis-api:latest -t aantt/raccourcis-api:${{ github.sha }} ./backend
          docker push --all-tags aantt/raccourcis-api

      - name: Build et push du frontend
        run: |
          docker build -t aantt/raccourcis-frontend:latest -t aantt/raccourcis-frontend:${{ github.sha }} ./frontend
          docker push --all-tags aantt/raccourcis-frontend
